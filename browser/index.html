<!DOCTYPE html>
<head>
    <title>STUDENT GRADE CALCULATOR</title>
</head>
<body>
    <h1> STUDENT GRADE CALCULATOR</h1>
    <form id = "gradeForm">
        <label for = "studentname">Student Name: </label>
        <input type = "text" id="studentname" required><br><br>

        <label for ="programming">PROGRAMMING: </label>
        <input type ="number" id = "programming" min = "0" max="100" required><br><br>

        <label for = "mathematics">MATHEMATICS: </label>
        <input type=" number" id ="mathematics" min ="0" max="100"  required><br><br>

        <label for = "networking">NETWORKING: </label>
        <input type = "number" id="networking" min ="0"max="100" required><br><br>

        <label for = "database">DATABASE:  </label>
        <input type = "number" id ="database" min="0" max="100" required><br><br>
    
    <button type = "submit">CALCULATE GRADE</button>
    </form>
    <div id="result"></div>
        <script src="script.js"></script> 

</body>
</html>
